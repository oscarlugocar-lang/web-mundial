<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 — Todos los Partidos y Predicciones</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--border:#475569;--text:#f8fafc;--text2:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--pink:#ec4899}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif}
  body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
  .container{max-width:1400px;margin:0 auto}
  header{text-align:center;padding:24px 0 16px}
  header h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  header p{color:var(--text2);font-size:14px;margin-top:4px}
  .filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
  .filters button{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
  .filters button:hover,.filters button.active{border-color:var(--accent);background:var(--accent);color:#000}
  .match-list{display:flex;flex-direction:column;gap:4px}
  .date-header{font-size:13px;font-weight:700;padding:8px 12px;background:var(--surface2);border-radius:8px;margin-top:8px;display:flex;justify-content:space-between}
  .match-card{display:grid;grid-template-columns:40px 1fr auto 1fr 40px;gap:6px;align-items:center;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:13px;transition:all .15s}
  .match-card.today{border-color:var(--green)}
  .match-card.done{opacity:.75}
  .match-card .group-badge{padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;background:var(--accent);color:#000;text-align:center;min-width:24px}
  .match-card .team{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .match-card .team.win{color:var(--green);font-weight:800}
  .match-card .score-btns{display:flex;gap:3px}
  .match-card .score-btns button{padding:4px 8px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:11px;font-weight:700;transition:all .1s;min-width:36px}
  .match-card .score-btns button:hover{opacity:.8}
  .match-card .score-btns button.sel1{background:var(--accent);color:#000;border-color:var(--accent)}
  .match-card .score-btns button.selX{background:var(--orange);color:#000;border-color:var(--orange)}
  .match-card .score-btns button.sel2{background:var(--accent2);color:#000;border-color:var(--accent2)}
  .groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:16px}
  .group-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
  .group-card h3{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px}
  .group-card .row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid var(--border)}
  .group-card .row:last-child{border:none}
  .group-card .row .pos{min-width:18px}
  .actions{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .actions button{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-weight:600}
  .actions button:hover{border-color:var(--accent);color:var(--accent)}
  .actions .danger:hover{border-color:var(--red);color:var(--red)}
  .simulator-toggle{text-align:center;margin-top:12px}
  .simulator-toggle a{color:var(--accent2);font-size:13px}
  @media(max-width:700px){
    .match-card{grid-template-columns:28px 1fr auto 1fr;font-size:12px}
    .match-card .score-btns button{min-width:30px;padding:3px 6px;font-size:10px}
    .groups-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🌍 Mundial 2026</h1>
  <p>Todos los partidos · Predicciones · Resultados en vivo</p>
</header>

<div class="filters" id="filters"></div>

<div class="match-list" id="matchList"></div>

<div class="actions">
  <button onclick="exportWC()">⬇ Exportar resultados</button>
  <button class="danger" onclick="if(confirm('¿Borrar todos los resultados?')){localStorage.removeItem('wc_results');renderWC()}">🗑 Borrar todo</button>
  <span style="color:var(--text2);font-size:12px;display:flex;align-items:center" id="updatedEl"></span>
</div>

<h2 style="font-size:18px;font-weight:700;margin-top:24px;color:var(--accent)">🏆 Tabla de Posiciones</h2>
<div class="groups-grid" id="groupsGrid"></div>

<div class="simulator-toggle">
  <a href="https://oscarlugocar-lang.github.io/dreamscape-landing1/" target="_blank">⚡ Dreamscape — IA para Edición de Video</a>
</div>
</div>

<script>
// ═══ TEAMS ═══
const FLAGS={"Argentina":"🇦🇷","Colombia":"🇨🇴","Uruguay":"🇺🇾","Brasil":"🇧🇷","Ecuador":"🇪🇨","Venezuela":"🇻🇪","Paraguay":"🇵🇾","Chile":"🇨🇱","Peru":"🇵🇪","Francia":"🇫🇷","Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Alemania":"🇩🇪","Espana":"🇪🇸","Italia":"🇮🇹","Paises Bajos":"🇳🇱","Belgica":"🇧🇪","Portugal":"🇵🇹","Croacia":"🇭🇷","Suiza":"🇨🇭","Dinamarca":"🇩🇰","Serbia":"🇷🇸","Austria":"🇦🇹","Polonia":"🇵🇱","Chequia":"🇨🇿","USA":"🇺🇸","Canada":"🇨🇦","Mexico":"🇲🇽","Japon":"🇯🇵","Corea del Sur":"🇰🇷","Arabia Saudita":"🇸🇦","Iran":"🇮🇷","Australia":"🇦🇺","Costa Rica":"🇨🇷","Jamaica":"🇯🇲","Marruecos":"🇲🇦","Tunez":"🇹🇳","Egipto":"🇪🇬","Nigeria":"🇳🇬","Camerun":"🇨🇲","Senegal":"🇸🇳","Costa de Marfil":"🇨🇮","Argelia":"🇩🇿","Mali":"🇲🇱","Panama":"🇵🇦","Uzbekistan":"🇺🇿","Qatar":"🇶🇦","Nueva Zelanda":"🇳🇿","Bosnia":"🇧🇦"};
const STATS={"Argentina":{w:75,gf:1.8,gc:0.4,p:62},"Colombia":{w:60,gf:1.5,gc:0.6,p:54},"Uruguay":{w:55,gf:1.8,gc:0.8,p:55},"Brasil":{w:50,gf:1.4,gc:1.1,p:58},"Ecuador":{w:59,gf:0.9,gc:1.6,p:46},"Venezuela":{w:49,gf:1.6,gc:1.2,p:47},"Paraguay":{w:40,gf:1.0,gc:1.2,p:45},"Chile":{w:33,gf:1.3,gc:1.3,p:50},"Peru":{w:37,gf:1.3,gc:1.1,p:42},"Francia":{w:59,gf:1.8,gc:1.8,p:42},"Inglaterra":{w:55,gf:0.9,gc:1.4,p:51},"Alemania":{w:62,gf:2.1,gc:1.0,p:57},"Espana":{w:58,gf:1.7,gc:0.9,p:65},"Italia":{w:53,gf:1.5,gc:0.8,p:56},"Paises Bajos":{w:57,gf:1.9,gc:1.0,p:58},"Belgica":{w:54,gf:1.6,gc:1.1,p:59},"Portugal":{w:52,gf:1.4,gc:1.2,p:55},"Croacia":{w:48,gf:1.3,gc:1.1,p:53},"Suiza":{w:45,gf:1.2,gc:1.3,p:49},"Dinamarca":{w:51,gf:1.5,gc:0.9,p:52},"Serbia":{w:44,gf:1.4,gc:1.4,p:47},"Austria":{w:42,gf:1.3,gc:1.5,p:48},"Polonia":{w:43,gf:1.2,gc:1.3,p:46},"Chequia":{w:41,gf:1.1,gc:1.4,p:44},"USA":{w:38,gf:1.0,gc:1.3,p:43},"Canada":{w:36,gf:0.9,gc:1.5,p:41},"Mexico":{w:47,gf:1.3,gc:1.0,p:48},"Japon":{w:46,gf:1.2,gc:1.1,p:50},"Corea del Sur":{w:40,gf:1.1,gc:1.3,p:45},"Arabia Saudita":{w:35,gf:0.8,gc:1.6,p:38},"Iran":{w:34,gf:0.9,gc:1.5,p:39},"Australia":{w:39,gf:1.0,gc:1.4,p:42},"Costa Rica":{w:32,gf:0.8,gc:1.7,p:40},"Jamaica":{w:31,gf:0.7,gc:1.8,p:38},"Marruecos":{w:44,gf:1.1,gc:0.9,p:45},"Tunez":{w:38,gf:0.9,gc:1.2,p:41},"Egipto":{w:42,gf:1.3,gc:1.0,p:44},"Nigeria":{w:40,gf:1.2,gc:1.1,p:43},"Camerun":{w:37,gf:1.0,gc:1.4,p:41},"Senegal":{w:41,gf:1.1,gc:1.2,p:42},"Costa de Marfil":{w:39,gf:1.0,gc:1.3,p:40},"Argelia":{w:43,gf:1.2,gc:1.0,p:44},"Mali":{w:33,gf:0.8,gc:1.5,p:37},"Panama":{w:30,gf:0.7,gc:1.9,p:36},"Uzbekistan":{w:34,gf:0.8,gc:1.6,p:38},"Qatar":{w:29,gf:0.6,gc:2.0,p:35},"Nueva Zelanda":{w:36,gf:0.9,gc:1.5,p:39},"Bosnia":{w:35,gf:0.9,gc:1.6,p:40}};

// ═══ GROUPS ═══
const GROUPS={A:["Corea del Sur","Chequia","Nigeria","Portugal"],B:["Canada","Bosnia"],C:["USA","Paraguay"],D:["Iran","Chile","Serbia","Italia"],E:["Uzbekistan","Alemania","Costa Rica","Ecuador"],F:["Polonia","Panama","Costa de Marfil","Argelia"],G:["Venezuela","Senegal","Espana","Mali"],H:["Jamaica","Qatar","Dinamarca","Francia"],I:["Croacia","Austria","Suiza","Colombia"],J:["Marruecos","Japon","Tunez","Paises Bajos"],K:["Mexico","Argentina","Nueva Zelanda","Peru"],L:["Australia","Brasil","Inglaterra","Camerun"],M:["Belgica","Uruguay","Arabia Saudita","Egipto"]};

// ═══ FIXED MATCHES ═══
const FIXED=[
  {d:"2026-06-12",g:"A",a:"Corea del Sur",b:"Chequia"},{d:"2026-06-12",g:"B",a:"Canada",b:"Bosnia"},{d:"2026-06-12",g:"C",a:"USA",b:"Paraguay"},
  {d:"2026-06-13",g:"D",a:"Iran",b:"Chile"},{d:"2026-06-13",g:"E",a:"Uzbekistan",b:"Alemania"},
  {d:"2026-06-14",g:"F",a:"Polonia",b:"Panama"},{d:"2026-06-14",g:"G",a:"Venezuela",b:"Senegal"},
  {d:"2026-06-15",g:"H",a:"Jamaica",b:"Qatar"},{d:"2026-06-15",g:"I",a:"Croacia",b:"Austria"},
  {d:"2026-06-16",g:"J",a:"Marruecos",b:"Japon"},{d:"2026-06-16",g:"K",a:"Mexico",b:"Argentina"},
  {d:"2026-06-17",g:"L",a:"Australia",b:"Brasil"},{d:"2026-06-17",g:"M",a:"Belgica",b:"Uruguay"},
  {d:"2026-06-18",g:"D",a:"Serbia",b:"Italia"},{d:"2026-06-18",g:"E",a:"Costa Rica",b:"Ecuador"},
  {d:"2026-06-19",g:"F",a:"Costa de Marfil",b:"Argelia"},{d:"2026-06-19",g:"G",a:"Espana",b:"Mali"},
  {d:"2026-06-20",g:"H",a:"Dinamarca",b:"Francia"},{d:"2026-06-20",g:"I",a:"Suiza",b:"Colombia"},
  {d:"2026-06-21",g:"J",a:"Tunez",b:"Paises Bajos"},{d:"2026-06-21",g:"K",a:"Nueva Zelanda",b:"Peru"},
  {d:"2026-06-22",g:"L",a:"Inglaterra",b:"Camerun"},{d:"2026-06-22",g:"M",a:"Arabia Saudita",b:"Egipto"},
];

// ═══ GENERATE ALL MATCHES ═══
function genMatches(){
  const map={}; FIXED.forEach(m=>{map[m.g+':'+m.a+':'+m.b]=m.d;map[m.g+':'+m.b+':'+m.a]=m.d;});
  const all=[];
  Object.keys(GROUPS).forEach(g=>{
    const t=GROUPS[g];
    for(let i=0;i<t.length;i++) for(let j=i+1;j<t.length;j++){
      const a=t[i],b=t[j],k=g+':'+a+':'+b;
      all.push({d:map[k]||null,g,a,b});
    }
  });
  const used=[],today=new Date();
  all.forEach(m=>{if(m.d)used.push(m.d);});
  let di=0;
  all.forEach(m=>{
    if(m.d)return;
    const d=new Date(today);d.setDate(d.getDate()+di);const ds=d.toISOString().slice(0,10);
    if(!used.includes(ds))used.push(ds);
    m.d=ds;di++;
  });
  return all;
}
const MATCHES=genMatches();

// ═══ PROBABILITY ═══
function prob(a,b){
  const dA=STATS[a],dB=STATS[b];
  if(!dA||!dB)return{pA:33,pD:34,pB:33};
  const pA=dA.w+(dA.gf*15)-(dB.gc*10)+(dA.p*0.2);
  const pB=dB.w+(dB.gf*15)-(dA.gc*10)+(dB.p*0.2);
  let prA=pA/(pA+pB),prB=pB/(pA+pB);
  const diff=Math.abs(prA-prB);
  let prD=Math.max(0.05,0.25-(diff*0.3));
  const rem=1-prD;prA=(prA/(prA+prB))*rem;prB=(prB/(prA+prB))*rem;
  return{pA:+(prA*100).toFixed(0),pD:+(prD*100).toFixed(0),pB:+(prB*100).toFixed(0)};
}

// ═══ RESULTS ═══
function getR(){try{return JSON.parse(localStorage.getItem('wc_results'))||{}}catch(e){return{}}}
function setR(i,v){const r=getR();r[i]=v;localStorage.setItem('wc_results',JSON.stringify(r));renderWC();}

// ═══ STANDINGS ═══
function standings(g){
  const t=GROUPS[g]||[],pts={},gf={},gc={};
  t.forEach(x=>{pts[x]=0;gf[x]=0;gc[x]=0;});
  const r=getR();
  MATCHES.forEach((m,i)=>{
    if(m.g!==g||!r[i])return;
    if(r[i]==='A'){pts[m.a]+=3;gf[m.a]++;gc[m.b]++;}
    else if(r[i]==='B'){pts[m.b]+=3;gf[m.b]++;gc[m.a]++;}
    else{pts[m.a]++;pts[m.b]++;gf[m.a]+=0.5;gf[m.b]+=0.5;gc[m.a]+=0.5;gc[m.b]+=0.5;}
  });
  return t.map(x=>({t:x,pts:pts[x],gd:gf[x]-gc[x]})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd);
}

// ═══ RENDER ═══
let filterGroup='';

function renderWC(){
  const today=new Date().toISOString().slice(0,10);
  const r=getR();
  const gkeys=Object.keys(GROUPS);

  // Filters
  let fhtml='<button class="'+(filterGroup===''?'active':'')+'" onclick="filterGroup=\'\';renderWC()">📋 Todos</button>';
  gkeys.forEach(g=>{
    const c=MATCHES.filter((m,i)=>m.g===g&&r[i]).length,t=MATCHES.filter(m=>m.g===g).length;
    fhtml+='<button class="'+(filterGroup===g?'active':'')+'" onclick="filterGroup=\''+g+'\';renderWC()">Grupo '+g+' ('+c+'/'+t+')</button>';
  });
  document.getElementById('filters').innerHTML=fhtml;

  // Group by date
  const byDate={};
  MATCHES.forEach((m,i)=>{
    if(filterGroup&&m.g!==filterGroup)return;
    if(!byDate[m.d])byDate[m.d]=[];
    byDate[m.d].push({...m,idx:i});
  });
  const dates=Object.keys(byDate).sort();

  let html='';
  dates.forEach(date=>{
    const isToday=date===today,isPast=date<today;
    const icon=isToday?'🔥':isPast?'✅':'📅';
    const clr=isToday?'var(--green)':isPast?'var(--text2)':'var(--orange)';
    html+='<div class="date-header" style="color:'+clr+'"><span>'+icon+' '+date+'</span><span>'+byDate[date].length+' partidos</span></div>';
    byDate[date].forEach(m=>{
      const res=r[m.idx],s=prob(m.a,m.b);
      const fA=FLAGS[m.a]||'',fB=FLAGS[m.b]||'';
      const cls=(isToday?' today':'')+(res?' done':'');
      html+='<div class="match-card'+cls+'">';
      html+='<span class="group-badge">'+m.g+'</span>';
      html+='<div class="team'+(res==='A'?' win':'')+'" style="text-align:right">'+fA+' '+m.a+'</div>';

      if(!res){
        html+='<div class="score-btns">';
        html+='<button onclick="setR('+m.idx+',\'A\')" title="'+m.a+'">'+s.pA+'%</button>';
        html+='<button onclick="setR('+m.idx+',\'X\')" title="Empate">X</button>';
        html+='<button onclick="setR('+m.idx+',\'B\')" title="'+m.b+'">'+s.pB+'%</button>';
        html+='</div>';
      } else {
        let label='',sel='';
        if(res==='A'){label='1';sel='sel1';}
        else if(res==='X'){label='X';sel='selX';}
        else{label='2';sel='sel2';}
        html+='<div class="score-btns"><button class="'+sel+'">'+label+'</button></div>';
      }

      html+='<div class="team'+(res==='B'?' win':'')+'" style="text-align:left">'+m.b+' '+fB+'</div>';
      if(!res)html+='<span style="font-size:10px;color:var(--text2);text-align:center">'+s.pA+'/'+s.pD+'/'+s.pB+'</span>';
      else html+='<span style="font-size:10px;color:var(--text2);text-align:center">✅</span>';
      html+='</div>';
    });
  });
  document.getElementById('matchList').innerHTML=html;

  // Standings
  let ghtml='';
  gkeys.forEach(g=>{
    const st=standings(g);
    ghtml+='<div class="group-card"><h3>Grupo '+g+'</h3>';
    st.forEach((s,j)=>{
      const m=j===0?'🥇':j===1?'🥈':j===2?'🥉':'';
      ghtml+='<div class="row"><span>'+m+' '+ (FLAGS[s.t]||'')+' '+s.t+'</span><span><strong>'+s.pts+'</strong></span></div>';
    });
    ghtml+='</div>';
  });
  document.getElementById('groupsGrid').innerHTML=ghtml;
  document.getElementById('updatedEl').textContent='🔄 '+new Date().toLocaleTimeString('es-CO');
}

function exportWC(){
  const r=getR();
  const data={exportedAt:new Date().toISOString(),results:{},standings:{}};
  MATCHES.forEach((m,i)=>{if(r[i])data.results[m.g+':'+m.a+'vs'+m.b]=r[i];});
  Object.keys(GROUPS).forEach(g=>{data.standings[g]=standings(g);});
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='mundial2026_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}

renderWC();
</script>
</body>
</html>
