<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mundial 2026 — Resultados en Vivo + Pronósticos</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0e17;--surface:#151929;--surface2:#1e2440;--border:#2a3158;--text:#e8ecf4;--text2:#8892b0;--accent:#38bdf8;--accent2:#818cf8;--green:#22c55e;--orange:#f59e0b;--red:#ef4444;--pink:#ec4899;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',sans-serif}
body{background:var(--bg);color:var(--text);padding:16px;min-height:100vh}
.container{max-width:1400px;margin:0 auto}
header{text-align:center;padding:20px 0 12px}
header h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header p{color:var(--text2);font-size:13px;margin-top:2px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.tabs button{padding:8px 22px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.tabs button:hover,.tabs button.active{border-color:var(--accent);background:var(--accent);color:#000}
.filters{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.filters button{padding:5px 12px;border-radius:16px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;font-weight:600;transition:all .15s}
.filters button:hover,.filters button.active{border-color:var(--accent);background:var(--accent);color:#000}
.match-list{display:flex;flex-direction:column;gap:3px}
.date-header{font-size:12px;font-weight:700;padding:6px 12px;background:var(--surface2);border-radius:8px;margin-top:8px;display:flex;justify-content:space-between}
.match-card{display:grid;grid-template-columns:32px 1fr auto 1fr 32px;gap:4px;align-items:center;padding:6px 10px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:12px;transition:all .1s}
.match-card:hover{border-color:var(--accent)}
.match-card.live{border-color:var(--red);box-shadow:0 0 12px rgba(239,68,68,.15)}
.match-card .group-badge{padding:2px 5px;border-radius:4px;font-size:9px;font-weight:700;background:var(--accent);color:#000;text-align:center;min-width:22px}
.match-card .team{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.match-card .team.win{color:var(--green)}
.match-card .score-area{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:90px}
.match-card .score-area .score{font-size:16px;font-weight:800;background:var(--surface2);padding:1px 14px;border-radius:6px;letter-spacing:1px}
.match-card .score-area .score.live-score{color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.match-card .score-area .pred-bar{display:flex;width:100%;height:4px;border-radius:2px;overflow:hidden}
.match-card .score-area .pred-bar span{transition:width .3s}
.match-card .score-area .predicted{font-size:10px;color:var(--orange);font-weight:600}
.score-btns{display:flex;gap:2px}
.score-btns button{padding:3px 6px;border-radius:4px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:10px;font-weight:700;transition:all .1s;min-width:28px}
.score-btns button:hover{opacity:.8;border-color:var(--accent)}
.score-btns button.sel1{background:var(--accent);color:#000;border-color:var(--accent)}
.score-btns button.selX{background:var(--orange);color:#000;border-color:var(--orange)}
.score-btns button.sel2{background:var(--accent2);color:#000;border-color:var(--accent2)}
.groups-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:12px}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px}
.group-card h3{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:5px}
.group-card .row{display:grid;grid-template-columns:18px 1fr 30px;gap:4px;font-size:11px;padding:2px 0;border-bottom:1px solid var(--border);align-items:center}
.group-card .row:last-child{border:none}
.group-card .row .pts{text-align:right;font-weight:700}
.actions{display:flex;gap:8px;justify-content:center;margin:10px 0 6px;flex-wrap:wrap}
.actions button{padding:5px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:11px;font-weight:600}
.actions button:hover{border-color:var(--accent);color:var(--accent)}
.actions .danger:hover{border-color:var(--red);color:var(--red)}
.status-badge{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700}
.status-badge.live{background:var(--red);color:#fff;animation:pulse 1.5s infinite}
.status-badge.finished{background:var(--surface2);color:var(--text2)}
.status-badge.scheduled{background:transparent;color:var(--orange);border:1px solid var(--orange)}
.loading{text-align:center;padding:40px;color:var(--text2)}
.error{text-align:center;padding:20px;color:var(--red)}
.last-updated{text-align:center;font-size:11px;color:var(--text2);margin-top:4px}
.flag-img{width:18px;height:12px;border-radius:2px;vertical-align:middle}
.team-name{display:flex;align-items:center;gap:4px}
@media(max-width:700px){
  .match-card{grid-template-columns:26px 1fr auto 1fr;font-size:11px;padding:5px 8px}
  .match-card .score-area .score{font-size:14px;padding:1px 10px}
  .groups-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .match-card .team{font-size:11px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>🌍 Mundial 2026</h1>
  <p>Todos los partidos · Resultados en vivo · Pronósticos IA</p>
  <div class="last-updated" id="updatedEl">Cargando...</div>
</header>

<div class="tabs">
  <button class="active" onclick="switchTab('matches')">⚽ Partidos</button>
  <button onclick="switchTab('predictions')">🔮 Pronósticos</button>
  <button onclick="switchTab('standings')">🏆 Tabla</button>
</div>

<div id="tabContent"></div>

<div class="actions">
  <button onclick="exportData()">⬇ Exportar</button>
  <button class="danger" onclick="if(confirm('¿Borrar resultados manuales?')){localStorage.removeItem('wc_results');render()}">🗑 Reset</button>
</div>
</div>

<script>
const API = 'https://wcup2026.org/api/data.php';
let allMatches = [], standings = {}, activeTab = 'matches', filterGroup = '';
const userResults = JSON.parse(localStorage.getItem('wc_results') || '{}');

async function loadData(){
  try{
    const [mr, sr] = await Promise.all([
      fetch(API+'?action=all'), fetch(API+'?action=standings')
    ]);
    const md = await mr.json(), sd = await sr.json();
    if(!md.ok) throw new Error('API matches error');
    if(!sd.ok) throw new Error('API standings error');
    allMatches = md.matches || [];
    standings = sd.standings || {};
    render();
    document.getElementById('updatedEl').textContent = '🔄 Actualizado: '+new Date().toLocaleTimeString('es-CO');
  }catch(e){
    document.getElementById('tabContent').innerHTML = '<div class="error">❌ Error al cargar datos: '+e.message+'</div>';
  }
}

function getTeamPoints(team, group){
  const gs = standings[group] || [];
  const t = gs.find(s => s.team === team);
  return t ? { pts: t.pts, gf: t.gf, ga: t.ga, gd: t.gd, p: t.p } : { pts: 0, gf: 0, ga: 0, gd: 0, p: 0 };
}

function predict(m){
  const ta = getTeamPoints(m.team1, m.group), tb = getTeamPoints(m.team2, m.group);
  const strengthA = ta.pts + ta.gd * 0.5 + 1, strengthB = tb.pts + tb.gd * 0.5 + 1;
  const total = strengthA + strengthB;
  const rawA = strengthA / total, rawB = strengthB / total;
  const drawFactor = 0.22 + Math.abs(rawA - rawB) * 0.15;
  const pA = Math.round((rawA * (1 - drawFactor)) * 100);
  const pB = Math.round((rawB * (1 - drawFactor)) * 100);
  const pX = 100 - pA - pB;
  const avgGoalsA = Math.max(0.3, ta.gf / Math.max(1, ta.p) * 0.7 + 0.5);
  const avgGoalsB = Math.max(0.3, tb.gf / Math.max(1, tb.p) * 0.7 + 0.5);
  const gA = Math.round((avgGoalsA * strengthA / total * 3 + Math.random() * 0.5) * 10) / 10;
  const gB = Math.round((avgGoalsB * strengthB / total * 3 + Math.random() * 0.5) * 10) / 10;
  return { pA, pX, pB, gA: Math.round(gA), gB: Math.round(gB) };
}

function render(){
  if(activeTab === 'matches') renderMatches();
  else if(activeTab === 'predictions') renderPredictions();
  else renderStandings();
}

function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.textContent.includes(tab==='matches'?'Partidos':tab==='predictions'?'Pronósticos':'Tabla')));
  render();
}

function renderFilters(){
  const gkeys = Object.keys(standings);
  let html = '<button class="'+(filterGroup===''?'active':'')+'" onclick="filterGroup=\'\';render()">📋 Todos</button>';
  gkeys.forEach(g => {
    const c = allMatches.filter(m => m.group === g && m.status === 'finished').length;
    const t = allMatches.filter(m => m.group === g).length;
    html += '<button class="'+(filterGroup===g?'active':'')+'" onclick="filterGroup=\''+g+'\';render()">'+g+' ('+c+'/'+t+')</button>';
  });
  document.getElementById('filters')?.remove();
  const f = document.createElement('div'); f.id = 'filters'; f.className = 'filters'; f.innerHTML = html;
  const tc = document.getElementById('tabContent');
  if(tc.firstChild) tc.insertBefore(f, tc.firstChild);
}

function renderMatches(){
  renderFilters();
  const today = new Date().toISOString().slice(0,10);
  const byDate = {};
  allMatches.forEach(m => {
    if(filterGroup && m.group !== filterGroup) return;
    if(!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });
  const dates = Object.keys(byDate).sort();
  let html = '<div class="match-list">';
  dates.forEach(date => {
    const isToday = date === today, isPast = date < today;
    const icon = isToday ? '🔥' : isPast ? '✅' : '📅';
    const clr = isToday ? 'var(--green)' : isPast ? 'var(--text2)' : 'var(--orange)';
    html += '<div class="date-header" style="color:'+clr+'"><span>'+icon+' '+date+'</span><span>'+byDate[date].length+' partidos</span></div>';
    byDate[date].forEach(m => {
      const pred = predict(m);
      const ur = userResults[m.id];
      let statusClass = '', statusLabel = '', scoreDisplay = '';
      const live = m.status === 'live';
      const finished = m.status === 'finished';
      if(live){ statusClass = 'live'; statusLabel = '🔴 EN VIVO'; scoreDisplay = (m.score?m.score[0]:'?')+' - '+(m.score?m.score[1]:'?'); }
      else if(finished && m.score){ scoreDisplay = m.score[0]+' - '+m.score[1]; }
      else { scoreDisplay = 'vs'; }

      let sel1='', selX='', sel2='';
      if(ur === m.team1) sel1='sel1'; else if(ur === 'X') selX='selX'; else if(ur === m.team2) sel2='sel2';

      html += '<div class="match-card'+(live?' live':'')+'">';
      html += '<span class="group-badge">'+m.group.replace('Group ','')+'</span>';
      html += '<div class="team'+(finished&&m.score&&m.score[0]>m.score[1]?' win':'')+'" style="text-align:right"><span class="team-name" style="justify-content:flex-end"><span>'+m.team1+'</span><img class="flag-img" src="'+m.flag1+'" alt="" loading="lazy"></span></div>';
      html += '<div class="score-area">';
      if(live){
        html += '<div class="score live-score">'+scoreDisplay+'</div>';
        html += '<span class="status-badge live">🔴 '+(m.live_minute||'')+'\'</span>';
      } else if(finished){
        html += '<div class="score">'+scoreDisplay+'</div>';
        html += '<span class="status-badge finished">Finalizado</span>';
      } else {
        html += '<div class="score">'+scoreDisplay+'</div>';
        html += '<div class="pred-bar"><span style="width:'+pred.pA+'%;background:var(--accent);height:4px"></span><span style="width:'+pred.pX+'%;background:var(--orange);height:4px"></span><span style="width:'+pred.pB+'%;background:var(--accent2);height:4px"></span></div>';
        html += '<div class="score-btns">';
        html += '<button class="'+sel1+'" onclick="setResult('+m.id+',\''+m.team1+'\')">1 <small>'+pred.pA+'%</small></button>';
        html += '<button class="'+selX+'" onclick="setResult('+m.id+',\'X\')">X <small>'+pred.pX+'%</small></button>';
        html += '<button class="'+sel2+'" onclick="setResult('+m.id+',\''+m.team2+'\')">2 <small>'+pred.pB+'%</small></button>';
        html += '</div>';
      }
      html += '</div>';
      html += '<div class="team'+(finished&&m.score&&m.score[1]>m.score[0]?' win':'')+'" style="text-align:left"><span class="team-name"><img class="flag-img" src="'+m.flag2+'" alt="" loading="lazy"><span>'+m.team2+'</span></span></div>';
      html += '</div>';
    });
  });
  html += '</div>';
  document.getElementById('tabContent').innerHTML = html;
}

function renderPredictions(){
  const today = new Date().toISOString().slice(0,10);
  const upcoming = allMatches.filter(m => m.status === 'scheduled' || m.status === 'upcoming');
  const byDate = {};
  upcoming.forEach(m => {
    if(!byDate[m.date]) byDate[m.date] = [];
    byDate[m.date].push(m);
  });
  const dates = Object.keys(byDate).sort();
  let html = '<h2 style="font-size:16px;font-weight:700;margin:4px 0 10px;text-align:center;color:var(--orange)">🔮 Pronósticos por Fecha</h2>';
  html += '<div style="text-align:center;font-size:12px;color:var(--text2);margin-bottom:12px">Basado en rendimiento histórico y puntos en la tabla. Los porcentajes se actualizan en vivo.</div>';
  html += '<div class="match-list">';
  dates.forEach(date => {
    html += '<div class="date-header" style="color:var(--orange)"><span>📅 '+date+'</span><span>'+byDate[date].length+' partidos</span></div>';
    byDate[date].forEach(m => {
      const p = predict(m);
      const winner = p.pA > p.pB && p.pA > p.pX ? m.team1 : p.pB > p.pA && p.pB > p.pX ? m.team2 : 'Empate';
      const conf = Math.max(p.pA, p.pB, p.pX);
      html += '<div class="match-card">';
      html += '<span class="group-badge">'+m.group.replace('Group ','')+'</span>';
      html += '<div class="team" style="text-align:right"><span class="team-name" style="justify-content:flex-end"><span>'+m.team1+'</span><img class="flag-img" src="'+m.flag1+'" alt="" loading="lazy"></span></div>';
      html += '<div class="score-area">';
      html += '<div style="font-size:18px;font-weight:800;color:var(--orange)">'+p.gA+' - '+p.gB+'</div>';
      html += '<div class="pred-bar"><span style="width:'+p.pA+'%;background:var(--accent)"></span><span style="width:'+p.pX+'%;background:var(--orange)"></span><span style="width:'+p.pB+'%;background:var(--accent2)"></span></div>';
      html += '<div style="font-size:10px;color:var(--green);font-weight:700">⬆ '+winner+' ('+conf+'%)</div>';
      html += '</div>';
      html += '<div class="team" style="text-align:left"><span class="team-name"><img class="flag-img" src="'+m.flag2+'" alt="" loading="lazy"><span>'+m.team2+'</span></span></div>';
      html += '</div>';
    });
  });
  html += '</div>';
  document.getElementById('tabContent').innerHTML = html;
}

function renderStandings(){
  const gkeys = Object.keys(standings);
  let html = '<h2 style="font-size:16px;font-weight:700;margin:4px 0 10px;text-align:center;color:var(--accent)">🏆 Tabla de Posiciones</h2>';
  html += '<div class="groups-grid">';
  gkeys.forEach(g => {
    const st = standings[g] || [];
    html += '<div class="group-card"><h3>'+g+'</h3>';
    st.forEach((s, i) => {
      const m = i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ';
      html += '<div class="row"><span>'+m+'</span><span>'+s.team+'</span><span class="pts">'+s.pts+'</span></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('tabContent').innerHTML = html;
}

function setResult(id, val){
  if(userResults[id] === val) delete userResults[id];
  else userResults[id] = val;
  localStorage.setItem('wc_results', JSON.stringify(userResults));
  render();
}

function exportData(){
  const data = { exportedAt: new Date().toISOString(), matches: allMatches, standings };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mundial2026_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
